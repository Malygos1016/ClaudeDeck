[project]
name = "claudedeck"
version = "0.1.0"
description = "Claude Code local session manager: find back conversations, live status board, archive before cleanup"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "markdown-it-py>=3.0",
    "psutil>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
