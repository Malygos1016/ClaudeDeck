<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClaudeDeck · 归档</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='5' fill='%23e2a13c'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body data-page="archive">

<header class="deck-header">
  <a class="wordmark" href="/">Claude<b>Deck</b></a>
  <nav class="deck-nav" id="nav"></nav>
  <div class="header-spacer"></div>
  <div id="annunciator" class="annunciator" hidden></div>
  <button id="rescan" class="ghost-btn" title="立即增量扫描重建索引">重新扫描</button>
  <div class="scanbar" id="scanbar" hidden>
    <div class="scanbar-fill"></div>
    <span class="scanbar-label mono"></span>
  </div>
</header>

<main class="wrap">
  <section class="board-sec">
    <div class="sec-head"><h2 class="sec-title">归档区</h2></div>
    <div class="panel-card" id="arc-info">加载中…</div>
    <div class="notice" style="margin-top:10px">
      归档 = <strong>手动封存</strong>:在会话详情页点「封存」才会拷贝到这里,没有任何自动备份。
      官方 <span class="mono">cleanupPeriodDays</span> 默认 30 天,超期 transcript 会被静默删除——
      封存过的仍可搜可看,还原回 <span class="mono">projects\</span> 即可重新 resume;没封存的删了就没了。
    </div>
  </section>

  <section class="board-sec">
    <div class="sec-head">
      <h2 class="sec-title">源已清理·可还原</h2>
      <span class="result-count" id="missing-count"></span>
    </div>
    <div class="results" id="missing-list"><div class="empty">加载中…</div></div>
  </section>
</main>

<div id="toast" class="toast" hidden></div>
<script type="module" src="/assets/archive.js"></script>
</body>
</html>
