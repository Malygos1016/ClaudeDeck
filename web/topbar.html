<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>CCTopBar</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  html, body { height: 100%; overflow: hidden; background: #0e1218; }
  #gl { position: fixed; inset: 0; width: 100%; height: 100%; }
  #bar {
    position: fixed; inset: 0; display: flex; align-items: center; gap: 10px;
    padding: 0 10px; font-family: "Microsoft YaHei UI", "Segoe UI", sans-serif;
  }
  #brand {
    font-family: "Cascadia Code", Consolas, monospace; font-size: 11px;
    color: #aeb7c4; letter-spacing: 0.08em; cursor: pointer; flex: none;
  }
  #brand b { color: #e2a13c; }
  #cells { display: flex; gap: 7px; align-items: center; overflow: hidden; flex: 1; height: 100%; }
  /* 两行模式:按列填充 → 红色堆左、黄色居中、绿色靠右(纵向排列) */
  #cells.two-rows {
    display: grid; grid-auto-flow: column;
    grid-template-rows: repeat(2, 1fr); grid-auto-columns: max-content;
    column-gap: 7px; row-gap: 0; align-items: center;
  }
  .cell {
    display: inline-flex; align-items: center; gap: 6px; flex: none;
    font-size: 12px; color: #d5dce6; line-height: 1;
    padding: 3px 10px; border-radius: 999px; cursor: pointer;
    background: rgba(14, 19, 27, 0.72); border: 1px solid rgba(160, 180, 210, 0.14);
    box-shadow: inset 1px 1px 0 rgba(255, 255, 255, 0.06);
    transition: border-color 0.15s ease, filter 0.15s ease;
    white-space: nowrap;
  }
  .cell:hover { border-color: #e2a13c; filter: brightness(1.18); }
  .cell.bg { border-style: dashed; opacity: 0.7; cursor: default; }
  .cell.waiting { border-color: rgba(217, 112, 96, 0.8); color: #f4ddd8; animation: breathe 1.6s ease-in-out infinite; }
  @keyframes breathe { 50% { box-shadow: 0 0 12px rgba(217, 112, 96, 0.5); } }
  .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .dot.busy { background: #e2a13c; box-shadow: 0 0 7px rgba(226, 161, 60, 0.8); }
  .dot.waiting { background: #d97060; box-shadow: 0 0 7px rgba(217, 112, 96, 0.9); }
  .dot.idle { background: #58b884; box-shadow: 0 0 5px rgba(88, 184, 132, 0.5); }
  .empty { font-size: 11.5px; color: #6b7686; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="bar"><span id="brand">CC<b>·</b>Deck</span><div id="cells"><span class="empty">连接中…</span></div></div>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

/* ================= 状态(渲染层与 shader 共享) ================= */
// 出生点固定锚在黄带起点(最靠左),不随黄带宽窄伸缩:出生点越靠右飞行路程越短、
// 特效量越少,固定在起点才能保证够长的一段路。终点仍是「最右格子右缘+15%」。
const SPAWN_W = 0.04;   // 飞块出生区固定宽度(屏宽比例)

// 分区边界一律是「该类格子右缘 ÷ 屏幕宽」的归一化位置,不是窗口数量占比——
// 数量占比与飞块终点(像素布局)是两套坐标,混用会让飞块生成在终点右侧倒飞。
const S = {
  // 目标值(轮询更新)与显示值(每帧指数平滑追踪,τ≈0.5s):色带缓动涨跌的机制
  redEnd: 0, yelEnd: 0,          // 红/黄带右边界(0 = 无该色)
  dispRedEnd: 0, dispYelEnd: 0,
  fadeEnd: 0.5, dispFade: 0.5,   // 飞块终点 = 最右格子右缘 + 15% 屏宽
  total: 0, nRed: 0, nYel: 0,
  logoFrac: 0.04,     // logo 区宽度占屏比(实测更新;飞块不在此区出生)
  finaleAt: -1,       // 全绿转场启动时刻(shader 时间基),-1 = 无
  sweepEnd: 0.5,      // 转场触发瞬间的红+黄总带右边界快照(绿条收卷终点)
  sweepRed: 0.0,      // 快照中红/黄分界(残带按原色分段绘制)
  redPulseAt: -1,     // 红带首现的红脉冲时刻
  // 飞块独立通道:强度平滑(黄清零时 0.3s 淡出,方块原地飞完不瞬灭),
  // 出生区间在黄存续期跟随黄带起点、清零后冻结
  sqInt: 0, sqB0: 0.05, sqB1: 0.1,
};

/* ================= GLSL:分区底色 + 黄区飞块 + 全绿转场 ================= */
const canvas = $("gl");
const gl = canvas.getContext("webgl", { antialias: false, alpha: false });
let uniforms = null;
if (gl) {
  const VS = "attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}";
  const FS = `precision mediump float;
uniform float t; uniform vec2 r;
uniform float uRedEnd, uYelEnd, uFadeEnd, uFinale, uSweepEnd, uRedPulse;
uniform float uSq, uSqB0, uSqB1, uSweepRed;

float hash(float n) { return fract(sin(n) * 43758.5453); }

// 圆角矩形 SDF(p=以中心为原点的物理像素坐标, b=半宽高, rad=圆角半径)
float sdRoundBox(vec2 p, vec2 b, float rad) {
  vec2 q = abs(p) - b + rad;
  return length(max(q, 0.0)) + min(max(q.x, q.y), 0.0) - rad;
}

// 绿条飞行曲线:快起减速 → 黄带末端「缓速掠过」(路程 5%,耗时 20%,肉眼可感)
// → S 形提速再缓停到最右;三段速度全程连续。m = 黄色特效结束处(动态)
float flightP(float u, float m) {
  m = clamp(m, 0.15, 0.85);
  float t1 = 0.35, tB = 0.20, t3 = 0.45;   // 时间分配(和=1)
  float vc = 0.05 / tB;                     // 慢速巡航:0.05 路程 / 0.2 时间
  float d1 = m - 0.025;
  float d3 = 1.0 - m - 0.025;
  float v0 = max(vc, 2.0 * d1 / t1 - vc);   // 起速(快),减速段路程=d1 的解析解
  if (u < t1) return v0 * u + (vc - v0) * u * u / (2.0 * t1);
  if (u < t1 + tB) return d1 + vc * (u - t1);
  float w = clamp((u - t1 - tB) / t3, 0.0, 1.0);   // 末段 Hermite:起速 vc,末速 0
  return (d1 + 0.05) + (w*w*w - 2.0*w*w + w) * t3 * vc + (3.0*w*w - 2.0*w*w*w) * d3;
}

vec3 darkBase(vec2 uv) {
  vec3 col = mix(vec3(0.050,0.066,0.090), vec3(0.066,0.086,0.118), uv.x);
  float w = sin(uv.x*5.0 - t*0.22) * sin(uv.x*2.3 + t*0.13);
  col += vec3(0.886,0.631,0.235) * smoothstep(0.55, 1.0, w) * 0.045;
  col += vec3(0.247,0.573,0.827) * smoothstep(0.6, 1.0, -w) * 0.04;
  vec2 g = fract(gl_FragCoord.xy / 14.0) - 0.5;
  col += smoothstep(0.16, 0.05, length(g)) * 0.028;
  return col;
}

void main() {
  vec2 uv = gl_FragCoord.xy / r;
  vec3 col = darkBase(uv);
  vec3 redC = vec3(0.42, 0.11, 0.10);   // 红区底色(暗红)
  vec3 yelC = vec3(0.40, 0.28, 0.07);   // 黄区底色(暗琥珀)

  float tr = 0.025;                      // 过渡半宽(前后合计约 5%)
  // 边界直接就是 JS 量出来的像素位置(该类最后一个格子右缘 ÷ 屏宽),不再由占比推算。
  // 首个有色带从 x=0 直接铺过 logo 区(无接缝):红带含 logo;无红时黄带含 logo
  float rw = uRedEnd;                    // 红带右边界,0 = 无红
  float yw = uYelEnd;                    // 黄带右边界,等于 rw 即无黄
  float wRed = (rw > 0.001) ? (1.0 - smoothstep(rw - tr, rw + tr, uv.x)) : 0.0;
  float wYel = 0.0;
  if (yw > rw + 0.001) {
    float startEdge = (rw > 0.001) ? smoothstep(rw - tr, rw + tr, uv.x) : 1.0;
    wYel = startEdge * (1.0 - smoothstep(yw - tr, yw + tr, uv.x));
  }
  col = mix(col, redC, wRed * 0.8);
  col = mix(col, yelC, wYel * 0.8);

  // 黄区飞块:出生点固定在黄带起点一小段(宽度不随黄带伸缩,越靠左路程越长、
  // 特效量越足),纵坐标随机抖动,ease-out 减速右飞,尾段减速时才渐隐;
  // 强度 uSq 独立于带宽平滑(黄清零→0.3s 原地淡出),几何用冻结区间 uSqB0/B1,
  // 任何转换(转红/转绿/finale)方块都不瞬灭
  float finT = (uFinale >= 0.0) ? (t - uFinale) : -1.0;
  if (uSq > 0.01) {
    float hs = clamp(r.y * 0.16, 4.0, 9.0); // 方块半边长(物理像素)
    float b0 = uSqB0;
    float b1 = uSqB1;
    float aScale = uSq;
    for (int i = 0; i < 9; i++) {
      float fi = float(i);
      float period = 1.4 + hash(fi * 7.13) * 1.3;
      float phase = t / period + hash(fi * 3.31);
      float cyc = fract(phase);
      float gen = floor(phase);
      float x0 = b0 + hash(fi * 5.77 + gen * 1.13) * (b1 - b0);  // 固定出生区内
      float pe = 1.0 - pow(1.0 - cyc, 2.6);  // ease-out:末段自然减速
      // 终点保底落在出生点右侧:任何配比下都不会倒着往左飞
      float dest = max(uFadeEnd, x0 + 0.12);
      float px = mix(x0, dest, pe);
      float py = 0.22 + 0.56 * hash(fi * 9.21 + gen * 2.71);
      vec2 p = vec2((uv.x - px) * r.x, (uv.y - py) * r.y);
      float m = 1.0 - smoothstep(-1.0, 1.0, sdRoundBox(p, vec2(hs), hs * 0.45)); // 圆角
      float alpha = (1.0 - smoothstep(0.68, 1.0, cyc)) * 0.8 * aScale;
      col = mix(col, vec3(0.98, 0.72, 0.22), m * alpha);
    }
  }

  // 全绿转场「绿条收卷」:绿条从最左向右扫,黄色只保留在绿条前方(被推着收走)
  // → 扫尽后独自滑到最右停留 → 整条闪绿 → 回深色
  if (finT >= 0.0) {
    float pxBar;
    if (finT < 1.55) {
      // 单一连续飞行 0.008→0.992:三段速度曲线,匀速段落在黄带快照末端附近
      float mNorm = (uSweepEnd - 0.008) / 0.984;
      pxBar = mix(0.008, 0.992, flightP(clamp(finT / 1.55, 0.0, 1.0), mNorm));
      float edge = 2.0 / r.x;   // 收卷前沿(约 2px 利落切边)
      float wKeep = smoothstep(pxBar, pxBar + edge, uv.x)
                  * (1.0 - smoothstep(uSweepEnd - tr, uSweepEnd + tr, uv.x));
      // 残带按原色分段:红/黄分界之前是红,之后是黄(红→绿的 Esc 场景也被收卷)
      float redPart = 1.0 - smoothstep(uSweepRed - tr, uSweepRed + tr, uv.x);
      col = mix(col, mix(yelC, redC, redPart), wKeep * 0.8);
    } else {
      pxBar = 0.992;            // 右端停留
    }
    if (finT < 2.0) {
      float hx = clamp(r.y * 0.045, 2.0, 3.5);
      float hy = r.y * 0.33;
      vec2 p2 = vec2((uv.x - pxBar) * r.x, (uv.y - 0.5) * r.y);
      float sd = sdRoundBox(p2, vec2(hx, hy), hx * 0.9);
      float glow = (1.0 - smoothstep(-1.0, 10.0, sd)) * 0.35;   // 柔光圈
      float core = 1.0 - smoothstep(-1.0, 1.0, sd);
      col = mix(col, vec3(0.30, 0.95, 0.55), glow);
      col = mix(col, vec3(0.62, 1.0, 0.78), core * 0.95);       // 高亮绿核心
    }
    float fl = smoothstep(1.55, 1.95, finT) * (1.0 - smoothstep(2.3, 3.0, finT));
    col = mix(col, vec3(0.10, 0.62, 0.34), fl * 0.8);           // 更亮更饱和的闪绿
  }

  // 红带首现:整条短促红脉冲(比常驻呼吸更强的「需要你」信号)
  if (uRedPulse >= 0.0) {
    float rt = t - uRedPulse;
    float pl = smoothstep(0.0, 0.08, rt) * (1.0 - smoothstep(0.12, 0.35, rt));
    col = mix(col, vec3(0.55, 0.15, 0.13), pl * 0.5);
  }

  gl_FragColor = vec4(col, 1.0);
}`;
  const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; };
  const prog = gl.createProgram();
  gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS));
  gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS));
  gl.linkProgram(prog); gl.useProgram(prog);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, "p");
  gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  uniforms = Object.fromEntries(
    ["t", "r", "uRedEnd", "uYelEnd", "uFadeEnd", "uFinale", "uSweepEnd", "uRedPulse",
     "uSq", "uSqB0", "uSqB1", "uSweepRed"]
      .map((n) => [n, gl.getUniformLocation(prog, n)])
  );
  let last = 0, lastDraw = 0, lastMeasure = -1e9;
  // 动效期不节流:rAF 由垂直同步驱动,天然锁在屏幕刷新率(180Hz 屏即 180fps),
  // 无需显式获取;静止时降到 5fps 省 GPU。平滑器按 dt 计算,帧率无关。
  (function loop(ms) {
    const animating =
      S.nRed > 0 || S.nYel > 0 ||
      S.dispRedEnd > 0.004 || S.dispYelEnd > 0.004 ||
      Math.abs(S.dispFade - S.fadeEnd) > 0.005 ||
      S.sqInt > 0.01 || S.finaleAt >= 0 || S.redPulseAt >= 0;
    if (ms - last >= (animating ? 0 : 200)) {
      last = ms;
      const dt = Math.min((ms - lastDraw) / 1000 || 0.033, 0.25);
      lastDraw = ms;
      // 显示值指数追踪目标值(τ=0.5s):色带边界缓动移动;中途改目标天然平滑改道
      const k = 1 - Math.exp(-dt / 0.5);
      S.dispRedEnd += (S.redEnd - S.dispRedEnd) * k;
      S.dispYelEnd += (S.yelEnd - S.dispYelEnd) * k;
      S.dispFade += (S.fadeEnd - S.dispFade) * k;
      // 飞块强度独立淡入淡出(τ=0.3s);出生区间仅在黄存续期更新,清零后冻结
      const k2 = 1 - Math.exp(-dt / 0.3);
      // 出生点锚在黄带起点,宽度写死 SPAWN_W;黄带比它还窄就收到黄带右界,
      // 不让方块溢出到绿区。logo 区不出生(否则盖住 CC·Deck 字样),
      // 黄带整个落在 logo 区内时没有可出生的空间,索性不生成。
      const spawnLeft = Math.max(S.logoFrac, S.dispRedEnd);
      const hasYel = S.nYel > 0 && S.dispYelEnd > spawnLeft + 0.005;
      S.sqInt += ((hasYel ? 1 : 0) - S.sqInt) * k2;
      if (hasYel) {
        S.sqB0 = spawnLeft;
        S.sqB1 = Math.min(S.dispYelEnd, S.sqB0 + SPAWN_W);
      }
      if (canvas.width !== innerWidth || canvas.height !== innerHeight) {
        canvas.width = innerWidth; canvas.height = innerHeight;
        gl.viewport(0, 0, canvas.width, canvas.height);
        measure();   // 尺寸变了几何全变;resize 事件不保证覆盖 DPI 变化与 AppBar 重排
        lastMeasure = ms;
      }
      // 定期重测兜底:render() 末尾那次跑在布局稳定之前(中文字形度量、AppBar 改高
      // 都会让格子宽度事后变化,实测多会话时边界会停在只量到首个格子的错值)。
      // 目标值改了也不会跳变——dispRedEnd/dispYelEnd/dispFade 会平滑追过去。
      if (ms - lastMeasure > 250) { lastMeasure = ms; measure(); }
      const tSec = ms / 1000;
      if (S.finaleAt >= 0 && tSec - S.finaleAt > 3.2) S.finaleAt = -1;
      if (S.redPulseAt >= 0 && tSec - S.redPulseAt > 0.5) S.redPulseAt = -1;
      gl.uniform1f(uniforms.t, tSec);
      gl.uniform2f(uniforms.r, canvas.width, canvas.height);
      gl.uniform1f(uniforms.uRedEnd, S.dispRedEnd);
      gl.uniform1f(uniforms.uYelEnd, S.dispYelEnd);
      gl.uniform1f(uniforms.uFadeEnd, S.dispFade);
      gl.uniform1f(uniforms.uFinale, S.finaleAt);
      gl.uniform1f(uniforms.uSweepEnd, S.sweepEnd);
      gl.uniform1f(uniforms.uRedPulse, S.redPulseAt);
      gl.uniform1f(uniforms.uSq, S.sqInt);
      gl.uniform1f(uniforms.uSqB0, S.sqB0);
      gl.uniform1f(uniforms.uSqB1, S.sqB1);
      gl.uniform1f(uniforms.uSweepRed, S.sweepRed);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    }
    requestAnimationFrame(loop);
  })(0);
}

/* ================= 数据与格子 ================= */
// 调试:?mock=r1y3g8 → 伪造 1 红 3 黄 8 绿,便于无真实红灯时验收视觉。
// 形状与 /api/live 的 groups 一致(一个窗口一个格子),不是原始会话列表。
const MOCK = (() => {
  const m = new URLSearchParams(location.search).get("mock");
  if (!m) return null;
  const g = /r(\d+)y(\d+)g(\d+)/.exec(m);
  if (!g) return null;
  const mk = (n, status) => Array.from({ length: +n }, (_, i) => {
    const label = i === 0 && status === "busy" ? "演示标签" : `${status}-会话-${i}`;
    return {
      key: `${status}-${i}`, label, full_label: label, status,
      has_window: true, focus_session_id: `${status}-${i}`, attach_job_id: null,
      members: [{ session_id: `${status}-${i}`, kind: "interactive", status }],
    };
  });
  return [...mk(g[1], "waiting"), ...mk(g[2], "busy"), ...mk(g[3], "idle")];
})();

let lastSig = "";
let lastGroups = null;    // 悬停展开树时按 key 回查成员
let prevActive = false;   // 上一轮是否存在红/黄(全绿转场的触发边沿)
let prevRedCount = 0;     // 红带首现的脉冲边沿

/* 分组排序:每次状态变更就重排,严格 红→黄→绿 三段。黄色继续往前挤,
   绿色不留在原地——同色必须连续,色带才能按像素贴合对应的格子。
   组内稳定:红/黄按首次出现先后;绿按变绿时刻倒序(最近完成的靠左)。
   作用对象是「格子」(一个窗口一个),不是原始会话,故以 key 标识。 */
let order = [];                    // 持久出现顺序(格子 key),组内稳定用
const prevStatus = new Map();
const greenAt = new Map();         // key → 变绿时刻(绿组内排序用)

function applyOrder(sessions) {
  const by = new Map(sessions.map((s) => [s.key, s]));
  order = order.filter((id) => by.has(id));
  const known = new Set(order);
  for (const s of sessions) if (!known.has(s.key)) order.push(s.key);

  const isIdle = (st) => st !== "waiting" && st !== "busy";
  const now = performance.now();
  for (const s of sessions) {
    const isNew = !prevStatus.has(s.key);
    if (prevStatus.get(s.key) !== s.status) {
      // 首次出现就是空闲的不算「刚完成」,不记时刻 → 排在绿组末尾
      if (isIdle(s.status) && !isNew) greenAt.set(s.key, now);
      else greenAt.delete(s.key);
      prevStatus.set(s.key, s.status);
    }
  }
  for (const id of [...greenAt.keys()]) if (!by.has(id)) greenAt.delete(id);
  for (const id of [...prevStatus.keys()]) if (!by.has(id)) prevStatus.delete(id);

  const rank = (st) => (st === "waiting" ? 0 : st === "busy" ? 1 : 2);
  // Array.sort 稳定(ES2019+):同 rank 未给比较结果时保持 order 的相对次序
  return order
    .map((id) => by.get(id))
    .sort((a, b) => {
      const d = rank(a.status) - rank(b.status);
      if (d !== 0) return d;
      if (rank(a.status) !== 2) return 0;
      return (greenAt.get(b.key) ?? 0) - (greenAt.get(a.key) ?? 0);
    });
}

/* 几何测量:色带边界与飞块终点全部按像素量,所以强依赖 innerWidth 与格子布局。
   必须与数据渲染解耦、可重复调用——窗口尺寸在 pywebview 创建后还会被
   on_shown 的 SetWindowPos 改一次,数据不变时 render() 不会再跑,
   只在 render() 里量一次会让边界永久停在中间尺寸算出的错值(实测差一倍)。
   状态从 DOM 的 .dot class 读,不依赖调用方传入会话数组。 */
const GAP_HALF = 3.5;   // 格子间 gap 的一半,让边界落在空隙中点

function measure() {
  const W = innerWidth || 1;
  const cells = [...$("cells").querySelectorAll(".cell")];
  let redEnd = 0, yelEnd = 0, rightmost = 0;
  for (const el of cells) {
    const right = (el.getBoundingClientRect().right + GAP_HALF) / W;
    const cls = el.querySelector(".dot")?.classList;
    // 分组排序保证同色连续,所以「该类最后一个的右缘」就是「该类总长度」
    if (cls?.contains("waiting")) redEnd = right;
    else if (cls?.contains("busy")) yelEnd = right;
    if (right > rightmost) rightmost = right;
  }
  S.logoFrac = Math.min(0.12, ($("brand").offsetWidth + 14) / W);
  S.redEnd = Math.min(1, redEnd);
  S.yelEnd = Math.min(1, Math.max(yelEnd, redEnd));   // 无黄时黄界=红界
  // 飞块终点 = 最右侧格子(绿组在最右)右缘 + 15% 屏宽;占满则以屏幕最右为界。
  // 0.3 只是量不到格子时的兜底默认,不是下限——当成下限会把单会话的终点顶到 0.45。
  S.fadeEnd = Math.min(1, (cells.length ? rightmost : 0.3) + 0.15);
}

addEventListener("resize", measure);

async function tick() {
  // 拉 groups(一个窗口一个格子)而不是原始会话列表:后者会把 CC 预热的空壳、
  // fork 出的守护进程各画一个格子,同一个窗口冒出三个块(2026-08-23 用户实报)
  let groups = MOCK;
  if (!groups) {
    try { groups = (await (await fetch("/api/live")).json()).groups; } catch { groups = null; }
  }
  const sig = JSON.stringify(groups);
  if (sig !== lastSig) { lastSig = sig; render(groups); }
}

function render(sessions) {
  const host = $("cells");
  lastGroups = sessions;
  if (!sessions || !sessions.length) {
    host.classList.remove("two-rows");
    host.innerHTML = `<span class="empty">${sessions ? "没有运行中的会话" : "ClaudeDeck 服务未运行"}</span>`;
    window.pywebview?.api?.set_rows?.(1);
    S.redEnd = S.yelEnd = 0; S.total = S.nRed = S.nYel = 0;
    prevActive = false;
    return;
  }
  const view = applyOrder(sessions);   // 分组重排(红→黄→绿,组内稳定)
  host.innerHTML = view.map((g) => {
    const st = ["busy", "waiting", "idle"].includes(g.status) ? g.status : "idle";
    // label 已由后端截断;完整名与成员清单进悬停提示(CC 给 fork 会话的名字
    // 直接是用户输入的整句 prompt,不截断会撑爆顶栏并带偏色带几何)
    const tip = [g.full_label, ...(g.members || []).map(
      (m) => `　· ${(m.session_id || "").slice(0, 8)} ${m.kind === "bg" ? "[后台]" : ""} ${m.status}`
    )].join("\n");
    const cls = `cell${g.has_window ? "" : " bg"}${st === "waiting" ? " waiting" : ""}`;
    // sid 用于激活窗口(找父),rename-sid 用于重命名(落到叉子后面那截所属的会话)
    // —— 两者在 fork 组里不是同一个,混用会把父会话的 tag 整个替换掉
    return `<span class="${cls}" data-key="${esc(g.key)}" data-sid="${esc(g.focus_session_id)}"
      data-rename-sid="${esc(g.rename_session_id)}" data-tag="${esc(g.rename_hint || "")}"
      data-window="${g.has_window ? 1 : 0}" data-job="${esc(g.attach_job_id || "")}"
      data-label="${esc(g.label)}" title="${esc(tip)}">
      <span class="dot ${st}"></span>${esc(g.label)}</span>`;
  }).join("");

  // 换行判定:单行放不下 → 两行网格(按列填充),原生窗口同步倍高
  host.classList.remove("two-rows");
  const overflow = host.scrollWidth > host.clientWidth + 1;
  if (overflow) host.classList.add("two-rows");
  S.rows = overflow ? 2 : 1;
  window.pywebview?.api?.set_rows?.(S.rows);

  // shader 状态:计数给 shader 判活,几何交给 measure()(见其注释,必须能重复调用)
  const nRed = sessions.filter((s) => s.status === "waiting").length;
  const nYel = sessions.filter((s) => s.status === "busy").length;
  S.total = sessions.length;
  S.nRed = nRed;
  S.nYel = nYel;
  measure();
  // 红带首现:整条红脉冲
  if (prevRedCount === 0 && nRed > 0) S.redPulseAt = performance.now() / 1000;
  prevRedCount = nRed;

  const active = nRed + nYel > 0;
  if (prevActive && !active) {
    // 全绿转场:拍下红+黄总带快照(边界即位置,直接取),常规带即刻交给收卷
    S.sweepRed = S.dispRedEnd;
    S.sweepEnd = S.dispYelEnd;
    S.finaleAt = performance.now() / 1000;
    S.dispRedEnd = 0;
    S.dispYelEnd = 0;
  }
  prevActive = active;
}
tick(); setInterval(tick, 2000);
// 行数独立执行:首次渲染可能早于 pywebview 桥注入(?. 静默吞掉 set_rows),
// mock 等静态数据又不会触发重渲染——每轮兜底执行,Python 侧同值零开销
setInterval(() => window.pywebview?.api?.set_rows?.(S.rows || 1), 2000);
window.addEventListener("pywebviewready", () => { lastSig = ""; tick(); });

const post = (url) => fetch(url, { method: "POST",
  headers: { "Content-Type": "application/json" }, body: "{}" });

// 点击 = 「带我过去」:有窗口就激活窗口,没窗口的游离作业开新终端 attach 接管。
// 旧实现按 kind=="bg" 一律不可点,但 fork 出的会话正是 bg 却有真实窗口。
document.addEventListener("click", (e) => {
  const cell = e.target.closest(".cell");
  if (!cell) return;
  if (cell.dataset.window === "1") post(`/api/live/${cell.dataset.sid}/focus`);
  else if (cell.dataset.job) post(`/api/jobs/${cell.dataset.job}/attach`);
});
$("brand").addEventListener("click", () => window.pywebview?.api?.open_deck());

/* 悬停展开会话树。
   只对多成员的组(即 fork 组)展开:绝大多数格子只有一个成员,弹一行的树没意义,
   而顶栏贴在屏幕最上沿、鼠标经过是常事,见谁弹谁会很烦。
   500ms 才展开(避免鼠标划过时误触),移出 250ms 才收(留出移到树窗口的时间,
   树那边进入时会通过 tree_hover 取消收起)。 */
const HOVER_IN_MS = 500, HOVER_OUT_MS = 250;
let hoverTimer = null, leaveTimer = null, treeKey = null;

/* Python 侧的看门狗按鼠标坐标收起树时回调这里清状态。
   否则前端仍以为「这棵树还开着」,再次悬停同一个格子会被判重跳过,
   表现为移开再移回就不弹了(实测)。 */
function clearTreeKey() { treeKey = null; }

function treePayload(g) {
  return {
    root_sid: g.members.find((m) => m.kind !== "bg")?.session_id
      || g.members[0]?.session_id,
    members: g.members.map((m) => ({
      session_id: m.session_id,
      job_id: m.job_id || "",
      kind: m.kind,
      status: m.status,
      cwd: m.cwd || "",
      label: m.tag || m.title || m.name || (m.session_id || "").slice(0, 8),
      // 有窗口的成员点了是跳转;纯后台作业点了是 attach 接管
      attachable_window: g.has_window,
    })),
  };
}

$("cells").addEventListener("mouseover", (e) => {
  const cell = e.target.closest(".cell");
  if (!cell) return;
  const g = (lastGroups || []).find((x) => x.key === cell.dataset.key);
  if (!g || (g.members || []).length < 2) return;   // 单成员不弹
  clearTimeout(leaveTimer);
  if (treeKey === g.key) return;                    // 已经展开的同一个,不重复弹
  clearTimeout(hoverTimer);
  hoverTimer = setTimeout(() => {
    treeKey = g.key;
    const r = cell.getBoundingClientRect();
    window.pywebview?.api?.tree(treePayload(g), r.left, g.members.length);
  }, HOVER_IN_MS);
});

$("cells").addEventListener("mouseout", (e) => {
  if (e.relatedTarget && e.relatedTarget.closest?.(".cell")) return;  // 格子间移动
  clearTimeout(hoverTimer);
  clearTimeout(leaveTimer);
  leaveTimer = setTimeout(() => {
    treeKey = null;
    window.pywebview?.api?.hide_tree();
  }, HOVER_OUT_MS);
});

/* 右键菜单:独立小弹窗窗口(主条不加高) */
document.addEventListener("contextmenu", (e) => {
  e.preventDefault();
  const cell = e.target.closest(".cell");
  window.pywebview?.api?.menu(
    cell ? cell.dataset.renameSid : null,   // 重命名目标,不是激活窗口用的那个
    cell ? cell.dataset.tag || cell.dataset.label : null,
    cell ? cell.dataset.tag : null,
    e.clientX
  );
});
</script>
</body>
</html>
